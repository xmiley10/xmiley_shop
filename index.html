<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smiley Shop</title>
<style>

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #fff5fa;

    color: #333;

}

header {

    background: linear-gradient(135deg, #ff8fc7, #ffb6d9);

    color: white;

    text-align: center;

    padding: 45px 20px;

}

.logo {

    font-size: 45px;

}

h1 {

    margin: 10px 0;

    font-size: 32px;

}

.subtitle {

    font-size: 16px;

}

.container {

    max-width: 900px;

    margin: auto;

    padding: 25px 15px;

}

.card {

    background: white;

    border-radius: 18px;

    padding: 25px;

    margin-bottom: 20px;

    box-shadow: 0 5px 20px rgba(0,0,0,0.08);

}

.card h2 {

    color: #ff5fa8;

    margin-top: 0;

}

.button {

    display: inline-block;

    background: #ff75b5;

    color: white;

    text-decoration: none;

    padding: 12px 22px;

    border-radius: 12px;

    margin-top: 10px;

}

footer {

    text-align: center;

    padding: 25px;

    color: #888;

}

</style>
</head>
<body>
<header>

<div class="logo">🛍️</div>

<h1>Smiley Shop</h1>

<div class="subtitle">ร้านเติม Free Fire</div>

</header>
<div class="container">
<div class="card">

<h2>💎 เติมเพชร Free Fire</h2>

<p>บริการเติมเพชร ราคาน่ารัก รวดเร็ว</p>

<a class="button" href="#">สั่งซื้อ</a>

</div>
<div class="card">

<h2>🎮 บริการของร้าน</h2>

<p>• เติมเพชร Free Fire</p>

<p>• ไอเทมภายในเกม</p>

<p>• บริการต่าง ๆ ของเกม</p>

</div>
<div class="card">

<h2>📞 ติดต่อร้าน</h2>

<p>สามารถติดต่อร้านเพื่อสอบถามรายละเอียดเพิ่มเติม</p>

</div>
 </div>
    <footer>

© 2026 Smiley Shop

</footer>
    
</body>

</html>
